<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font:13px -apple-system,sans-serif;color:#41464d}main{height:100vh;border:1px solid #d3d6db;border-radius:9px;overflow:hidden;position:relative;background:#fafafb}header{height:35px;display:flex;align-items:center;gap:9px;padding:0 10px;border-bottom:1px solid #ddd}.graph-counts{flex:1;color:#656b73}.graph-tip,.graph-message{position:absolute;background:#fff;padding:6px;border-radius:4px;pointer-events:none}.graph-tip small{display:block}.graph-message{top:50%;left:35%}canvas{display:block;width:100%;height:calc(100% - 35px);border-color:#507192;outline-color:#858e98;touch-action:none}button{cursor:pointer}
</style></head><body><main><header><b>项目关系图</b><span class="graph-counts"></span><button data-zoom="out" aria-label="缩小">−</button><span class="graph-scale"></span><button data-zoom="in" aria-label="放大">+</button><button data-zoom="fit">适应窗口</button></header><canvas aria-label="项目关系图，双击节点打开"></canvas><div class="graph-tip" hidden><b></b><small></small></div><div class="graph-message" hidden></div></main>
<script src="SimaQ/graph-layout.js"></script><script src="SimaQ/graph.js"></script><script>
const projectGraph=SimaGraph.mount(document.querySelector('main'),{tr:s=>s,open:path=>webkit.messageHandlers.graph.postMessage(path)});
function updateGraph(data,atlas) {
  document.querySelector('header b').textContent=atlas?'专题与个股':'项目关系图';
  document.querySelector('canvas').setAttribute('aria-label',atlas?'Atlas 专题与个股关系图，双击节点打开':'项目关系图，双击节点打开');
  projectGraph.update(data);
}
</script></body></html>
