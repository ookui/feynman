<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="xterm.css"><style>
html,body{margin:0;height:100%;background:#20232a;color:#ecedf0;font:13px system-ui}
body{display:flex;flex-direction:column}#terminal{position:relative;flex:1;min-height:0;margin:6px 9px}.xterm{height:100%}
#composer{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:10px 14px;background:#20232a}
#composer.follow-up{position:static;border-top:1px solid #525765}.follow-up textarea{flex:none;height:2.8em}
#exit{padding:8px 14px;border-top:1px solid #525765}#composer[hidden],#exit[hidden]{display:none}textarea{flex:1;min-height:22px;resize:none;color:inherit;background:transparent;border:0;outline:none;font:14px/1.55 Menlo,monospace}
footer{display:flex;gap:14px;align-items:center;justify-content:flex-end;color:#bbc2d0}
button{border:0;border-radius:5px;padding:5px 14px;background:#cedaf0;color:#20232a;font-weight:600}button:disabled{opacity:.5}
</style></head><body><div id="terminal"></div><div id="composer"><textarea id="draft" aria-label="提示词" spellcheck="false"></textarea><footer><span id="hint">回车发送 · Shift 回车换行</span><button id="send" disabled>发送</button></footer></div><div id="exit" role="status" hidden></div><script src="xterm.js"></script><script src="console.js"></script></body></html>
